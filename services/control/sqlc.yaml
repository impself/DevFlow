version: "2"
sql:
  - engine: "postgresql"
    # schema 直接指向迁移目录：表结构唯一真源就是 0001_init.sql，
    # sqlc 解析不到的列在编译期报错——查询与表结构永不漂移。
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "pgx/v5"
        # 可空列生成 *string 而非 pgtype.Text：判空更直白，scan 赋值更顺手
        emit_pointers_for_null_types: true
